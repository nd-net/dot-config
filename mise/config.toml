[tools]
assh = "latest"
claude = "latest"
codex = "latest"
deno = "latest"
dotnet = "8"
gemini = "latest"
gh = "latest"
git-filter-repo = "latest"
git-lfs = "latest"
"github:avivsinai/bitbucket-cli" = "latest"
gitui = "latest"
go = "latest"
htmlq = "latest"
java = "latest"
jq = "latest"
lua = "latest"
node = "latest"
perl = "latest"
pre-commit = "latest"
python = "latest"
rust = "latest"
swiftformat = "latest"
swiftgen = "latest"
uv = "latest"
websocat = "latest"
xcodes = "latest"

[tools.yt-dlp]
version = "latest"
rename_exe = "yt-dlp"

# jdtls has no clean versioned URL (Eclipse ships timestamped tarballs, no GitHub
# releases) and was dropped from the mise registry, so it's pinned via the http
# backend. Bump with `mise run jdtls-refresh` (see jdtls-refresh.py).
[tools."http:jdtls"]
version = "1.58.0"
url = "https://download.eclipse.org/jdtls/milestones/1.58.0/jdt-language-server-1.58.0-202604151538.tar.gz"
checksum = "sha256:2a5bbe55ec91b4325392050dc422cead3220a2459b3766be35e1fff45b4a50d9"
bin_path = "bin"

[env]
# XDG bases
XDG_CONFIG_HOME = "{{env.HOME}}/.config"
XDG_CACHE_HOME  = "{{env.HOME}}/.cache"
XDG_DATA_HOME   = "{{env.HOME}}/.local/share"
XDG_STATE_HOME  = "{{env.HOME}}/.local/state"
XDG_BIN_HOME    = "{{env.HOME}}/.local/bin"

# Tool install/runtime dirs that must be set before mise installs
# or first-runs the tool, otherwise they create ~/<toolname> dirs.
# Don't reference XDG_* variables because the evaluation order is not guaranteed
CARGO_HOME            = "{{env.HOME}}/.local/share/cargo"
RUSTUP_HOME           = "{{env.HOME}}/.local/share/rustup"
NUGET_PACKAGES        = "{{env.HOME}}/.local/share/nuget/packages"
NPM_CONFIG_USERCONFIG = "{{env.HOME}}/.config/npm/npmrc"
YARN_RC_FILENAME      = "{{env.HOME}}/.config/yarn/yarnrc.yml"
GRADLE_USER_HOME      = "{{env.HOME}}/.cache/gradle"
CODEX_HOME            = "{{env.HOME}}/.local/share/codex"
AZURE_CONFIG_DIR      = "{{env.HOME}}/.config/azure"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"

# https://mise.jdx.dev/configuration/settings.html
[settings]
idiomatic_version_file_enable_tools = ["python", "ruby", "node"]

[settings.python]
default_packages_file = "{{env.XDG_CONFIG_HOME}}/python/default-python-packages"

[settings.ruby]
default_packages_file = "{{env.XDG_CONFIG_HOME}}/ruby/default-gems"

[tasks."jdtls-refresh"]
description = "Pin the latest jdtls milestone into the http:jdtls backend and reinstall"
run = "python3 \"$HOME/.config/mise/jdtls-refresh.py\""
